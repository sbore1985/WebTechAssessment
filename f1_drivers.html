<!DOCTYPE html>
<html lang="en">

<head>
    <title>Formula1-Wiki: Drivers</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/f1_logo.png" alt="F1 Wiki Logo - Home" />
        </a>
    </header>

    <!-- Main navigation shared across the sites information pages -->
    <nav aria-label="Main">
        <ul>
            <li><a href="f1_drivers.html">Drivers</a></li>
            <li><a href="f1_teams.html">Teams</a></li>
            <li><a href="f1_standings.html">Standings</a></li>
            <li><a href="f1_circuits.html">Circuits</a></li>
        </ul>
    </nav>
    <hr>

    <main class="container">
        <!-- Label for attribute connects it to the search inputs id -->
        <label for="q">Search drivers</label>
        <input type="search" id="q" placeholder="e.g. Alonso">
        <h1>Drivers</h1>

        <!-- Used role='status' to let assistive tech annouce the loading/results updates -->
        <p id="status_msg" role="status"></p>

        <!-- Inserts one card per matching driver into this section -->
        <section class="cards" id="driver_cards"></section>
    </main>

    <script>
        // Find elements that JavaScript will update
        const cards = document.getElementById("driver_cards");
        const searchBox = document.getElementById("q");
        const statusMsg = document.getElementById("status_msg");
        // Stores driver records downloaded from the api
        let allDrivers = [];

        // async/await used to wait for each api response before continuing
        //Fetch reference: https://www.w3schools.com/js/js_api_fetch.asp
        // API docs: https://f1api.dev/docs
        async function loadDrivers() {
            // As per docs, requests upto 30 records per request, using the number already loaded as the offset
            // Also placed upper limit on the number of requests
            for (let page = 0; page < 40; page++) {
            const res = await fetch(`https://f1api.dev/api/drivers?limit=30&offset=${allDrivers.length}`);

            // Checking !res.ok, adding error handling.
            // Reference: https://www.w3schools.com/js/js_async_fetch.asp
            if (!res.ok) {
                statusMsg.textContent = "Unable to load drivers";
                return;
            }
            
            // Convert res from json text into JavaScript object
            const data = await res.json();

            // When nothing left to return stop/break
            if (data.drivers.length === 0) break;

            // Creates combined array which includes existing and newly downloaded data
            allDrivers = allDrivers.concat(data.drivers);

            // Refreshes the displayed cards and progress
            showDrivers();
            statusMsg.textContent = "Loading drivers... " + allDrivers.length + " so far";
            }
            statusMsg.textContent = allDrivers.length + " drivers loaded";
        }

        // shows the drivers that match what's typed in the search box and search both first name and surname
        // Reference: https://www.w3schools.com/jsref/jsref_tolowercase.asp
        // https://www.w3schools.com/jsref/jsref_includes.asp
        function showDrivers() {
            const text = searchBox.value.toLowerCase();
            const matches = allDrivers.filter(d => (d.name + " " + d.surname).toLowerCase().includes(text));
            
            // Remove old results before adding filter
            cards.textContent = "";

            // forEach runs makeCard for every matching driver and adds/appends the card
            // https://www.w3schools.com/js/js_array_iteration.asp
            // https://www.w3schools.com/jsref/met_node_appendchild.asp
            matches.forEach(d => cards.appendChild(makeCard(d)));
        }

        // Input fires off/shows as the user types
        // References:https://www.w3schools.com/js/js_htmldom_eventlistener.asp
        searchBox.addEventListener("input", showDrivers);

        // Starts downloading driver data when the script runs
        loadDrivers();


        // Create and return one article per driver
        //  The createElement creates individual DOM elements and the append/appendChild places them in the document 
        // https://www.w3schools.com/jsref/met_node_appendchild.asp
        // https://www.w3schools.com/jsref/met_document_createelement.asp
        function makeCard(d) {
            const card = document.createElement("article");
            card.className = "card";

            // Helmet image
            const helmet = document.createElement("div");
            helmet.className = "helmet";
            const img = document.createElement("img");
            img.src = "images/helmet.png";
            img.alt = "";
            helmet.appendChild(img);

            const name = document.createElement("h2");
            name.textContent = d.name + " " + d.surname;
            name.style.color = "crimson";

            // Details creates a browser expandable section
            // https://www.w3schools.com/tags/tag_details.asp
            const details = document.createElement("details");
            details.className = "details";

            const rows = [
                ["Nationality", d.nationality],
                ["Current Race Number", d.number],
                ["Birthday", d.birthday],
                ["Short Name", d.shortName]
            ];

            // Create a paragraph for each driver detail
            //  ?? uses "N/A" when a value is null/undefined
            rows.forEach(([label, value]) => {
                const line = document.createElement("p");
                line.textContent = label + ": " + (value ?? "N/A");
                details.appendChild(line);
            });

            // Create/add optional link to the drivers Wikipedia page, if the api provides the details
            const wiki = document.createElement("p")
            wiki.textContent = "Wiki URL: ";
            if (d.url) {
                const link = document.createElement("a");
                link.href = d.url;
                link.textContent = "Wikipedia";
                link.target = "_blank";
                link.rel = "noopener";
                wiki.appendChild(link);
            } else { wiki.textContent += "N/A"; }

            details.appendChild(wiki);

            // Append all created elements to the card 
            // Reference: https://www.w3schools.com/jsref/met_element_append.asp
            card.append(helmet, name, details);
            return card;
        }

    </script>

    <footer>
        <p><a href="contactUs.html">Contact F1 Wiki</a></p>
        <p>Created by S. Bore | 2026 | Data from
            <a href="https://f1api.dev">f1api.dev</a>
        </p>
    </footer>

</body>

</html>
