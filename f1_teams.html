<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #8c8c8c;
        }

        body {
            isolation: isolate;
            padding: 40px;
        }

        body::before {
            position: fixed;
            content: "";
            inset: 0;
            background: url('f1_vehicles.jpg') center / cover no-repeat;
            opacity: 50%;
            z-index: -1;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 6px;
        }

        .header a.logo {
            display: block;
            line-height: 0;
        }

        .header img {
            display: block;
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position: center;
        }

        .header a.logo:hover img {
            filter: brightness(1.5)
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #8c8c8c;
            display: flex;
            justify-content: center;
        }

        li {
            float: center;
        }

        li a,
        .dropbtn {
            display: inline-block;
            color: black;
            font-style: bold;
            font-size: large;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        li a:hover,
        .dropdown:hover .dropbtn {
            background-color: #8c8c8c;
        }

        li.dropdown {
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #8c8c8c;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            max-height: 30vh;
            overflow-y: auto;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 350px));
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: #e7e7e7;
            opacity: 90%;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .helmet img {
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 330px;
            height: auto;
            mix-blend-mode: multiply;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: minmax(0, 350px);
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="index.html" class="logo">
            <img src="f1_logo.png" alt="F1 Wiki Logo" />
        </a>

        <ul>
            <li><a href="f1_drivers.html">Drivers</a></li>
            <li><a href="f1_teams.html">Teams</a></li>
            <li><a href="f1_standings.html">Standings</a></li>
            <li><a href="f1_circuits.html">Circuits</a></li>
        </ul>
    </div>
    <main class="container">
        <section class="cards" id="teams_cards"></section>
    </main>

    <script>
        const API_URL = "https://f1api.dev/api/teams";
        const cards = document.getElementById("teams_cards");

        async function loadTeams() {
            cards.textContent = "loading teams..";
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("HTTP" + res.status);
                const data = await res.json();

                cards.textContent = "";
                data.teams.forEach(t => cards.appendChild(makeCard(t)));
            } catch (err) {
                cards.textContent = "Couldn't load teams";
                console.error(err);
            }
        }

        function makeCard(t) {
            const card = document.createElement("article");
            card.className = "card";

            const helmet = document.createElement("div");
            helmet.className = "helmet";
            const img = document.createElement("img");
            img.src = "helmet.png";
            img.alt = "Helmet image";
            helmet.appendChild(img);

            const name = document.createElement("h2");
            name.textContent = t.teamName;

            const details = document.createElement("details");
            details.className = "details";

            const rows = [
                ["Team Nationality", t.teamNationality],
                ["Constructore Championships Won", t.constructorsChampionships],
                ["Driver Championships Won", t.driversChampionships],
                ["Year First Raced", t.firstAppeareance]
            ];

            rows.forEach(([label, value]) => {
                const line = document.createElement("p");
                line.textContent = label + ": " + (value ?? "N/A");
                details.appendChild(line);
            });

            const wiki = document.createElement("p")
            wiki.textContent = "Wiki URL: ";
            if (t.url) {
                const link = document.createElement("a");
                link.href = t.url;
                link.textContent = "Wikipedia";
                link.target = "blank";
                link.rel = "noopener";
                wiki.appendChild(link);
            } else { wiki.textContent += "N/A"; }

            details.appendChild(wiki);

            card.append(helmet, name, details);
            return card;
        }

        loadTeams();
    </script>
</body>

</html>
