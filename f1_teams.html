<!DOCTYPE html>
<html lang="en">

<head>
    <title>Formula1-Wiki: Teams</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/f1_logo.png" alt="F1 Wiki Logo - Home" />
        </a>
    </header>

    <!-- Main navigation shared across the sites information pages -->
    <nav aria-label="Main">
        <ul>
            <li><a href="f1_drivers.html">Drivers</a></li>
            <li><a href="f1_teams.html">Teams</a></li>
            <li><a href="f1_standings.html">Standings</a></li>
            <li><a href="f1_circuits.html">Circuits</a></li>
        </ul>
    </nav>
    <hr>
    <main class="container">
        <label for="q">Search Teams</label>
        <input type="search" id="q" placeholder="e.g. McLaren">
        <h1>Teams</h1>
        <p id="status_msg" role="status"></p>
        <section class="cards" id="teams_cards"></section>
    </main>

    <script>

        const cards = document.getElementById("teams_cards");
        const searchBox = document.getElementById("q");
        const statusMsg = document.getElementById("status_msg")
        let allTeams = [];

        // async/await used to wait for each api response before continuing
        //Fetch reference: https://www.w3schools.com/js/js_api_fetch.asp
        // API docs: https://f1api.dev/docs
        async function loadTeams() {
            for (let page = 0; page < 40; page++) {
                const res = await fetch(`https://f1api.dev/api/teams?limit=30&offset=${allTeams.length}`);

                // Convert res from json text into JavaScript object
                const data = await res.json();

                // When nothing left to return stop/break
                if (data.teams.length === 0) break;

                // Creates combined array which includes existing and newly downloaded data
                allTeams = allTeams.concat(data.teams);

                // Refreshes the displayed cards and progress
                showTeams();
                statusMsg.textContent = "Loading teams... " + allTeams.length + " so far";
            }
            statusMsg.textContent = allTeams.length + " teams loaded";
        }

        // shows the teams that match what's typed in the search box
        // Reference: https://www.w3schools.com/jsref/jsref_tolowercase.asp
        // https://www.w3schools.com/jsref/jsref_includes.asp
        function showTeams() {
            const text = searchBox.value.toLowerCase();
            const matches = allTeams.filter(t => t.teamName.toLowerCase().includes(text));

            // Remove old results before adding filter
            cards.textContent = "";

            // forEach runs makeCard for every matching team and adds/appends the card
            // https://www.w3schools.com/js/js_array_iteration.asp
            // https://www.w3schools.com/jsref/met_node_appendchild.asp
            matches.forEach(t => cards.appendChild(makeCard(t)));
        }

        // Input fires off/shows as the user types
        // References:https://www.w3schools.com/js/js_htmldom_eventlistener.asp
        searchBox.addEventListener("input", showTeams);

        // Starts downloading team data when the script runs
        loadTeams();

        // Create and return one article per team
        //  The createElement creates individual DOM elements and the append/appendChild places them in the document 
        // https://www.w3schools.com/jsref/met_node_appendchild.asp
        // https://www.w3schools.com/jsref/met_document_createelement.asp
        function makeCard(t) {
            const card = document.createElement("article");
            card.className = "card";

            // Team image
            const team = document.createElement("div");
            team.className = "teams";
            const img = document.createElement("img");
            img.src = "images/teams.png";
            img.alt = "";
            team.appendChild(img);

            const name = document.createElement("h2");
            name.textContent = t.teamName;
            name.style.color = "crimson";

            // Details creates a browser expandable section
            // https://www.w3schools.com/tags/tag_details.asp
            const details = document.createElement("details");
            details.className = "details";

            const rows = [
                ["Team Nationality", t.teamNationality],
                ["Constructors Championships Won", t.constructorsChampionships],
                ["Driver Championships Won", t.driversChampionships],
                ["Year First Raced", t.firstAppeareance]
            ];

            // Create a paragraph for each teams detail
            //  ?? uses "N/A" when a value is null/undefined
            rows.forEach(([label, value]) => {
                const line = document.createElement("p");
                line.textContent = label + ": " + (value ?? "N/A");
                details.appendChild(line);
            });

            // Create/add optional link to the teams Wikipedia page, if the api provides the details
            const wiki = document.createElement("p")
            wiki.textContent = "Wiki URL: ";
            if (t.url) {
                const link = document.createElement("a");
                link.href = t.url;
                link.textContent = "Wikipedia";
                link.target = "_blank";
                link.rel = "noopener";
                wiki.appendChild(link);
            } else { wiki.textContent += "N/A"; }

            details.appendChild(wiki);

            // Append all created elements to the card 
            // Reference: https://www.w3schools.com/jsref/met_element_append.asp
            card.append(team, name, details);
            return card;
        }


    </script>

    <footer>
        <p><a href="contactUs.html">Contact F1 Wiki</a></p>
        <p>Created by S. Bore | 2026 | Data from
            <a href="https://f1api.dev">f1api.dev</a>
        </p>
    </footer>
</body>

</html>
