<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #8c8c8c;
        }

        body {
            isolation: isolate;
            padding: 40px;
        }

        body::before {
            position: fixed;
            content: "";
            inset: 0;
            background: url('f1_wallpaper_start_finish.jpg') center / cover no-repeat;
            opacity: 50%;
            z-index: -1;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 6px;
        }

        .header a.logo {
            display: block;
            line-height: 0;
        }

        .header img {
            display: block;
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position: center;
        }

        .header a.logo:hover img {
            filter: brightness(1.5)
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #8c8c8c;
            opacity: 90%;
            display: flex;
            justify-content: center;
        }

        li {
            float: center;
        }

        li a,
        .dropbtn {
            display: inline-block;
            color: black;
            font-style: bold;
            font-size: large;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        li a:hover,
        .dropdown:hover .dropbtn {
            background-color: #8c8c8c;
        }

        li.dropdown {
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #8c8c8c;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            max-height: 30vh;
            overflow-y: auto;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="index.html" class="logo">
            <img src="f1_logo.png" alt="F1 Wiki Logo" />
        </a>

        <ul>
            <li><a href="f1_drivers.html">Drivers</a></li>
            <li><a href="f1_teams.html">Teams</a></li>
            <li><a href="f1_standings.html">Standings</a></li>
            <li><a href="f1_circuits.html">Circuits</a></li>
        </ul>
    </div>
    </div>
    </div>
    </div>

</body>

</html>
