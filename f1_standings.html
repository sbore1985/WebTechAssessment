<!DOCTYPE html>
<html lang="en">

<head>
    <title>Formula1-Wiki: Standings</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/f1_logo.png" alt="F1 Wiki Logo - Home" />
        </a>
    </header>

    <!-- Main navigation shared across the sites information pages -->
    <nav aria-label="Main">
        <ul>
            <li><a href="f1_drivers.html">Drivers</a></li>
            <li><a href="f1_teams.html">Teams</a></li>
            <li><a href="f1_standings.html">Standings</a></li>
            <li><a href="f1_circuits.html">Circuits</a></li>
        </ul>
    </nav>
    <hr>
    <main class="container">
        <h1>Drivers' Championship</h1>
        <p>
            <label for="Year">Season: </label>
            <!-- Select element to allow users to choose which season to query -->
            <!-- Reference: https://www.w3schools.com/html/html_form_elements.asp -->
            <select id="Year">
                <option>2026</option>
                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
                <option>2022</option>
                <option>2021</option>
                <option>2020</option>
                <option>2019</option>
                <option>2018</option>
                <option>2017</option>
            </select>
        </p>

        <!-- HTML table for standings into rows and columns -->
        <!-- Reference: https://www.w3schools.com/html/html_tables.asp -->
        <div class="standings-wrap">
            <table class="standings">
                <thead>
                    <tr>
                        <th scope="col">Pos</th>
                        <th scope="col">Driver</th>
                        <th scope="col">Team</th>
                        <th scope="col">Points</th>
                        <th scope="col">Wins</th>
                    </tr>
                </thead>
                <!-- Inserts a table row for each championship result -->
                <tbody id="standings_body"></tbody>
            </table>
        </div>
    </main>
    <script>
        const yearSelect = document.getElementById("Year");
        const tbody = document.getElementById("standings_body");

        // When selection changes, fetch and display the years standings
        // Reference: https://www.w3schools.com/js/js_htmldom_eventlistener.asp
        yearSelect.addEventListener("change", loadStandings);

        // Fetch standings for selected year
        // API docs: https://f1api.dev/docs
        async function loadStandings() {
            const Year = yearSelect.value;

            //Fetch reference: https://www.w3schools.com/js/js_api_fetch.asp
            // Clear standings so results from other seasons when selected are not mixed together
            tbody.innerHTML = "";
            if (Year === "") return;
            const res = await fetch(`https://f1api.dev/api/${Year}/drivers-championship`);

            // Convert response from json text into JavaScript Object
            const data = await res.json();
            const list = data.drivers_championship || [];

            // Create one table row per driver. Values inserted into a string
            // Reference: https://www.w3schools.com/js/js_string_templates.asp            
            list.forEach(s => {
                tbody.innerHTML += `
      <tr> 
        <td>${s.position}</td>
        <td>${s.driver.name} ${s.driver.surname}</td>
        <td>${s.team.teamName}</td>
        <td>${s.points}</td>
        <td>${s.wins}</td>
        </tr>`;

            });
        }

        // Load default season when page first opens
        loadStandings();
    </script>

    <footer>
        <p><a href="contactUs.html">Contact F1 Wiki</a></p>
        <p>Created by S. Bore | 2026 | Data from
            <a href="https://f1api.dev">f1api.dev</a>
        </p>
    </footer>
</body>

</html>
