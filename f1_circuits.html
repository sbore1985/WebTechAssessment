<!DOCTYPE html>
<html lang="en">

<head>
    <title>Formula1-Wiki: Circuits</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/f1_logo.png" alt="F1 Wiki Logo - Home" />
        </a>
    </header>

    <!-- Main navigation shared across the sites information pages -->
    <nav aria-label="Main">
        <ul>
            <li><a href="f1_drivers.html">Drivers</a></li>
            <li><a href="f1_teams.html">Teams</a></li>
            <li><a href="f1_standings.html">Standings</a></li>
            <li><a href="f1_circuits.html">Circuits</a></li>
        </ul>
    </nav>
    <hr>
    <main class="container">
        <h1>Circuits</h1>
        <p>
            <label for="country">Country: </label>

            <!-- Select element to allow users to choose which country to query -->
            <!-- Reference: https://www.w3schools.com/html/html_form_elements.asp -->
            <select id="country">
                <option value="">Choose a Country</option>
            </select>
        </p>

        <!-- HTML table for circuits into rows and columns -->
        <!-- Reference: https://www.w3schools.com/html/html_tables.asp -->
        <div class="standings-wrap">
            <table class="standings">
                <thead>
                    <tr>
                        <th scope="col">Circuit</th>
                        <th scope="col">City</th>
                        <th scope="col">Length</th>
                        <th scope="col">Corners</th>
                        <th scope="col">Lap Record</th>
                        <th scope="col">Lap Record Held By</th>
                    </tr>
                </thead>

                <!-- Inserts a table row for each circuit result -->
                <tbody id="circuits_body"></tbody>
            </table>
        </div>
    </main>
    <script>
        const countrySelect = document.getElementById("country");
        const tbody = document.getElementById("circuits_body");
        // Stores circuits records downloaded from the api
        let allCircuits = []

        // Retrieve circuit data from F1 api
        // References: https://www.w3schools.com/js/js_api_fetch.asp and https://f1api.dev/docs
        async function loadCircuits() {
            const res = await fetch("https://f1api.dev/api/circuits?limit=30");
            const data = await res.json();
            allCircuits = data.circuits || [];

            // map extracts country, Set removes duplicates and sort puts them in alphabetical order
            // References: https://www.w3schools.com/react/react_es6_spread.asp
            // https://www.w3schools.com/js/js_object_sets.asp
            // https://www.w3schools.com/jsref/jsref_map.asp
            // https://www.w3schools.com/js/js_array_sort.asp
            const countries = [...new Set(allCircuits.map(c => c.country))].sort();

            // Dropdown option for each unique country returned
            // Reference: https://www.w3schools.com/js/js_string_templates.asp
            countries.forEach(name => {
                countrySelect.innerHTML += `<option>${name}</option>`;
            });
        }

        // Filters existing circuit list when new country is selected
        countrySelect.addEventListener("change", showCircuits);

        function showCircuits() {
            const country = countrySelect.value;

            // Clear any rows from previous result/selection
            tbody.innerHTML = "";

            // Filter and return circuits that match selection
            // Reference: https://www.w3schools.com/jsref/jsref_filter.asp
            const matches = allCircuits.filter(c => c.country === country);

            // For every match add a row. ?? display N/A for Null or undefined result
            matches.forEach(c => {
                tbody.innerHTML += `
      <tr> 
        <td>${c.circuitName}</td>
        <td>${c.city ?? "N/A"}</td>
        <td>${c.circuitLength ?? "N/A"}</td>
        <td>${c.numberOfCorners ?? "N/A"}</td>
        <td>${c.lapRecord ?? "N/A"}</td>
        <td>${c.fastestLapDriverId ?? "N/A"}</td>
        </tr>`;

            });
        }

        // Load circuit data and populate dropdown at page load
        loadCircuits();
    </script>

    <footer>
        <p><a href="contactUs.html">Contact F1 Wiki</a></p>
        <p>Created by S. Bore | 2026 | Data from
            <a href="https://f1api.dev">f1api.dev</a>
        </p>
    </footer>
</body>

</html>
